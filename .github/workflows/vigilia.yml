# Vigilia externa de Tasa Pana, antes Tasa Clara (https://tasapana.socialwebseo.com)
#
# Las tasas se actualizan con un cron del hosting cada cinco minutos, y el
# propio sitio trae un vigilante (/push/salud.php) que repara el cron y relanza
# la actualización cuando ve datos viejos. Pero ese vigilante lo despierta una
# visita. Esta vigilia lo despierta cada diez minutos desde fuera del hosting,
# haya visitas o no, y avisa por correo (una ejecución fallida de GitHub) si las
# tasas llevan más de 30 minutos sin actualizarse.
name: Vigilia de Tasa Pana

on:
  schedule:
    # Minutos «no redondos»: GitHub retrasa o salta los programados en los
    # minutos de más carga (:00, :10…), según su propia documentación.
    - cron: '3,13,23,33,43,53 * * * *'
    # Latido mensual: GitHub apaga los programados de un repo público tras
    # 60 días sin actividad; un commit al mes lo mantiene encendido.
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigilia
  cancel-in-progress: false

jobs:
  vigilar:
    if: github.event.schedule != '17 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar al vigilante y comprobar que las tasas están al día
        shell: bash
        run: |
          set -uo pipefail
          SITIO='https://tasapana.socialwebseo.com'
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Mobile Safari/537.36'
          R=''
          for intento in 1 2 3; do
            R=$(curl -s --max-time 30 -A "$UA" -H 'Accept: application/json' "$SITIO/push/salud.php" || true)
            if echo "$R" | jq -e '.tasasEdadMin' > /dev/null 2>&1; then break; fi
            echo "intento $intento sin respuesta válida; se reintenta"
            R=''
            sleep 20
          done
          if [ -z "$R" ]; then
            echo "::error::El vigilante del sitio no respondió en tres intentos."
            exit 1
          fi
          echo "$R" | jq .
          EDAD=$(echo "$R" | jq -r '.tasasEdadMin // 999')
          CRON=$(echo "$R" | jq -r '.cron // "?"')
          INGESTA=$(echo "$R" | jq -r '.ingesta // "?"')
          DIVISAS=$(echo "$R" | jq -r '.divisasEdadMin // 999')
          echo "Tasas de hace $EDAD min · divisas del mundo de hace $DIVISAS min · cron: $CRON · ingesta: $INGESTA"
          if [ "$EDAD" -gt 30 ]; then
            # Si el vigilante acaba de pedir la actualización, se le da un minuto.
            sleep 60
            R2=$(curl -s --max-time 30 -A "$UA" "$SITIO/push/salud.php" || true)
            EDAD=$(echo "$R2" | jq -r '.tasasEdadMin // 999' 2>/dev/null || echo 999)
            if [ "$EDAD" -gt 30 ]; then
              echo "::error::Las tasas de Tasa Pana llevan $EDAD minutos sin actualizarse (cron: $CRON, ingesta: $INGESTA)."
              exit 1
            fi
          fi
          if [ "$DIVISAS" -gt 360 ]; then
            echo "::error::Las divisas del mundo llevan $DIVISAS minutos sin actualizarse."
            exit 1
          fi

  latido:
    if: github.event.schedule == '17 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Latido mensual
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > latido.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latido.txt
          git commit -m 'Latido mensual: mantiene activa la vigilia'
          git push
